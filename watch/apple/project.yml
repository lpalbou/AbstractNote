name: AbstractNoteWatch
options:
  bundleIdPrefix: ai.abstractframework.note
  deploymentTarget:
    watchOS: "26.0"
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  AbstractGatewayClient:
    path: Packages/AbstractGatewayClient
targets:
  AbstractNoteWatch:
    type: application
    platform: watchOS
    scheme: {}
    sources: [Sources/App, Resources]
    dependencies:
      - package: AbstractGatewayClient
    info:
      path: Resources/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true   # plain http to a gateway on the LAN (192.168.x.x, .local); internet stays https
        WKApplication: true
        # Watch-only: no companion iPhone app (docs/clients.md). A companion would need
        # WKRunsIndependentlyOfCompanionApp + WKCompanionAppBundleIdentifier instead.
        WKWatchOnly: true
        CFBundleDisplayName: Note
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Export compliance: only the system's HTTPS (exempt).
        ITSAppUsesNonExemptEncryption: false
        # Keeps the app running with the screen off while a note is sent or a question answered
        # (WKExtendedRuntimeSession; Sources/App/Shared/RuntimeKeeper.swift).
        WKBackgroundModes: [self-care]
        NSLocationWhenInUseUsageDescription: "Note adds where you were to the notes you send, so you can find them by place later."
        NSMicrophoneUsageDescription: "Note uses the microphone only when you dictate a note or a question."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.abstractframework.note.watch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Device installs: automatic signing with the developer's team. CLI/CI simulator builds pass
        # CODE_SIGNING_ALLOWED=NO and ignore this.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: K3R4D6HP2A
        # Archived only inside the AbstractNote container (App Store / TestFlight): a second
        # top-level app in the archive makes it a "generic archive" with no distribution method.
        SKIP_INSTALL: YES
        SWIFT_STRICT_CONCURRENCY: complete
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG

  # UI checks that need a real tap. Own scheme: the app's scheme and CI do not build it.
  AbstractNoteWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources: [UITests]
    dependencies:
      - target: AbstractNoteWatch
    scheme:
      testTargets: [AbstractNoteWatchUITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.abstractframework.note.watch.uitests
        TEST_TARGET_NAME: AbstractNoteWatch
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: K3R4D6HP2A
        SWIFT_STRICT_CONCURRENCY: complete

  # App Store / TestFlight carrier: a watch-only app ships inside an empty iOS container
  # (product type watchapp2-container). No code, no UI; the store installs only the watch app.
  AbstractNote:
    type: application.watchapp2-container
    platform: iOS
    scheme: {}
    sources: []
    dependencies:
      - target: AbstractNoteWatch
    info:
      path: Container/Info.plist
      properties:
        CFBundleDisplayName: AbstractNote
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.abstractframework.note
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: K3R4D6HP2A
        TARGETED_DEVICE_FAMILY: "1"
